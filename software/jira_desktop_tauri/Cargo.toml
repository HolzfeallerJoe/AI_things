[package]
name = "jira-native"
version = "0.1.0"
edition = "2021"
description = "A Jira client that talks to the REST API and draws its own interface - no browser engine"
authors = ["Holzfealler_Joe"]
license = "MIT"

[dependencies]
eframe = { version = "0.35", default-features = false, features = [
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
egui = "0.35"
# rustls-native-certs, not webpki-roots: corporate networks often re-sign TLS, and the
# OS trust store is what has the intercepting certificate in it.
reqwest = { version = "0.13", default-features = false, features = [
    "blocking",
    "json",
    "rustls",
    "rustls-native-certs",
    "http2",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
keyring = "4"
directories = "6"
opener = "0.7"
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
